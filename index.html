<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f2a26">
<title>観察マップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --paper:#f2f3ee; --paper-2:#e7e9e2; --ink:#1f2a26; --ink-2:#55605b; --ink-3:#8a948f;
  --line:#cfd4cd; --card:#ffffff;
  --sound:#2c6ea8; --sound-soft:#dbe8f4;
  --smell:#b8642a; --smell-soft:#f4e3d4;
  --tool:#3f8a5a;  --tool-soft:#d9ede0;
  --memo:#6b7370;  --memo-soft:#e3e6e2;
  --star:#c79a1a;
  --shadow:0 6px 24px rgba(31,42,38,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#181d1b; --paper-2:#202623; --ink:#e9ece8; --ink-2:#aab2ad; --ink-3:#737c77;
    --line:#333b37; --card:#242b28;
    --sound:#6fa6dc; --sound-soft:#22364a;
    --smell:#e08a4e; --smell-soft:#3f2a1c;
    --tool:#6fc08a;  --tool-soft:#1f3a2a;
    --memo:#9aa39f;  --memo-soft:#2c3330;
    --star:#e0b647;
    --shadow:0 6px 24px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#181d1b; --paper-2:#202623; --ink:#e9ece8; --ink-2:#aab2ad; --ink-3:#737c77;
  --line:#333b37; --card:#242b28;
  --sound:#6fa6dc; --sound-soft:#22364a;
  --smell:#e08a4e; --smell-soft:#3f2a1c;
  --tool:#6fc08a;  --tool-soft:#1f3a2a;
  --memo:#9aa39f;  --memo-soft:#2c3330;
  --star:#e0b647;
  --shadow:0 6px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
/* per-walk accent: body[data-mode] */
body{--ac:var(--memo);--ac-soft:var(--memo-soft)}
body[data-mode="sound"]{--ac:var(--sound);--ac-soft:var(--sound-soft)}
body[data-mode="smell"]{--ac:var(--smell);--ac-soft:var(--smell-soft)}
body[data-mode="tool"]{--ac:var(--tool);--ac-soft:var(--tool-soft)}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.55;color:var(--ink);background:var(--paper);
  overflow:hidden;-webkit-text-size-adjust:100%;
}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:64px}
[hidden]{display:none!important}

#app{height:100%;display:flex;flex-direction:column}

header{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;
  background:var(--paper);border-bottom:1px solid var(--line);z-index:5;
}
header h1{font-size:16px;font-weight:700;margin:0;letter-spacing:.02em}
header .walk{flex:1;min-width:0;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .walk b{color:var(--ink);font-weight:500}
header .walk .k{display:inline-block;font-size:10px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;background:var(--ac-soft);color:var(--ac);margin-right:6px;vertical-align:1px}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line);background:var(--card);flex:0 0 auto}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{flex:1 1 auto;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
#map{width:100%;height:100%;background:var(--paper-2)}
.leaflet-container{font-family:inherit}
.leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.6)}

/* pins */
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center}
.pin.sound{background:var(--sound)} .pin.smell{background:var(--smell)} .pin.tool{background:var(--tool)} .pin.memo{background:var(--memo)}
.pin i{transform:rotate(45deg);width:8px;height:8px;border-radius:50%;background:#fff;opacity:.9}
.pin.s1 i{width:5px;height:5px} .pin.s3 i{width:11px;height:11px}
.pin.memo i{width:0;height:0}
.pin.memo{width:18px;height:18px;border-radius:3px;transform:rotate(45deg)}
.pin.star{border-color:var(--star);box-shadow:0 0 0 3px rgba(199,154,26,.35),0 2px 6px rgba(0,0,0,.35)}
.pin.dim{opacity:.28}
.me{width:14px;height:14px;border-radius:50%;background:#1f2a26;border:3px solid #fff;box-shadow:0 0 0 2px rgba(31,42,38,.35)}
.leaflet-popup-content{margin:10px 12px;font-size:13px;line-height:1.45;min-width:160px}
.leaflet-popup-content .t{font-size:11px;color:#666;letter-spacing:.06em}
.leaflet-popup-content b{display:block;font-size:14px}
.leaflet-popup-content .ono{font-style:italic}

/* map overlay */
.fab-wrap{position:absolute;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:10px;justify-content:center;align-items:stretch;pointer-events:none;z-index:400}
.fab{pointer-events:auto;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow);letter-spacing:.04em;font-weight:700}
.fab.main{flex:1;max-width:260px;background:var(--ac);color:#fff;font-size:17px}
.fab.memo{flex:0 0 auto;padding:0 18px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:14px;font-weight:500}
.fab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab:active{transform:scale(.97)}
.start-hint{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:400;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);font-size:14px;color:var(--ink-2);display:flex;gap:12px;align-items:center}
.start-hint .btn{flex:0 0 auto}
.mode-tip{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:400;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 12px;border-radius:999px;box-shadow:var(--shadow);white-space:nowrap}

/* list */
.list{height:100%;overflow-y:auto;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 80px)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink-2);background:var(--card)}
.chip.on{color:var(--ink);border-color:var(--ink);font-weight:500}
.timeline{border-left:2px solid var(--line);margin-left:52px;padding-left:16px}
.row{position:relative;padding:10px 0 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .time{position:absolute;left:-70px;top:12px;width:44px;text-align:right;font-size:12px;color:var(--ink-2)}
.row .dot{position:absolute;left:-23px;top:16px;width:10px;height:10px;border-radius:50%;border:2px solid var(--paper);background:var(--ac)}
.row.memo .dot{background:var(--memo);border-radius:2px}
.row .label{font-weight:700;font-size:15px}
.row.memo .label{font-weight:400}
.row .label .k{font-size:11px;font-weight:500;letter-spacing:.06em;padding:1px 6px;border-radius:4px;margin-right:6px;vertical-align:1px;background:var(--memo-soft);color:var(--memo)}
.row .meta{grid-column:1/-1;font-size:13px;color:var(--ink-2)}
.row .ono{font-style:italic}
.row .strength{color:var(--ink-3);font-size:12px;letter-spacing:.1em}
.row .strength b{color:var(--ink)}
.row .star{grid-row:1;grid-column:2;font-size:20px;line-height:1;color:var(--line)}
.row .star.on{color:var(--star)}
.row .edit{grid-column:1/-1;font-size:12px;color:var(--ink-3);justify-self:start}
.empty{color:var(--ink-2);font-size:14px;padding:30px 0;text-align:center}
.daysep{font-size:12px;color:var(--ink-3);letter-spacing:.08em;margin:18px 0 6px -68px}

/* walks */
.walks{height:100%;overflow-y:auto;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 80px);max-width:560px}
.walks h2,.list h2{font-size:13px;color:var(--ink-3);letter-spacing:.1em;font-weight:500;margin:0 0 10px}
.modes{display:grid;gap:8px;margin-bottom:10px}
.mode{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.mode .sw{grid-row:1/3;width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.mode .sw svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mode[data-m="sound"] .sw{background:var(--sound)} .mode[data-m="smell"] .sw{background:var(--smell)} .mode[data-m="tool"] .sw{background:var(--tool)}
.mode .n{font-weight:700}
.mode .d{font-size:12px;color:var(--ink-2)}
.mode.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.newwalk{display:flex;gap:8px;margin-bottom:18px}
.newwalk input{flex:1}
.walkcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center}
.walkcard.current{border-color:var(--ink)}
.walkcard .bar{grid-row:1/3;width:4px;height:34px;border-radius:2px}
.walkcard .bar.sound{background:var(--sound)} .walkcard .bar.smell{background:var(--smell)} .walkcard .bar.tool{background:var(--tool)}
.walkcard .name{font-weight:700}
.walkcard .sub{grid-column:2;font-size:12px;color:var(--ink-2)}
.walkcard .go{grid-row:1/3;grid-column:3;font-size:13px;color:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper)}
.walkcard .go.now{color:var(--paper);background:var(--ink);border-color:var(--ink)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:9px 14px;font-weight:500;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{border-color:#b33;color:#b33;background:transparent}
.tools{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin-top:22px}
.tools .btn{text-align:center}
.help{font-size:13px;color:var(--ink-2);margin-top:20px;line-height:1.7}
.help b{color:var(--ink)}

nav{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;padding:9px 0 8px;font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.04em}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,26,23,.45);z-index:900;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:901;background:var(--card);border-radius:18px 18px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);box-shadow:0 -8px 30px rgba(0,0,0,.25);max-height:88%;overflow-y:auto;transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet .head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sheet .head .kind{font-weight:700;font-size:17px;color:var(--ac)}
.sheet.memo .head .kind{color:var(--memo)}
.sheet .head .when{font-size:12px;color:var(--ink-2)}
.sheet .head .where{font-size:11px;color:var(--ink-3);margin-left:auto}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px;letter-spacing:.04em}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:9px 0;font-size:14px;color:var(--ink-2);background:var(--paper)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ac);color:#fff;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--ink-2);background:var(--paper)}
.chips button.on{border-color:var(--ac);color:var(--ac);background:var(--ac-soft)}
.more-toggle{font-size:13px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;margin:2px 0 12px;display:inline-block}
.starrow{display:flex;align-items:center;gap:10px;padding:4px 0 8px}
.starrow button{font-size:26px;line-height:1;color:var(--line)}
.starrow button.on{color:var(--star)}
.starrow span{font-size:13px;color:var(--ink-2)}
.actions{display:flex;gap:8px;margin-top:6px}
.actions .btn{flex:1;text-align:center;padding:12px}
.actions .btn.save{background:var(--ac);border-color:var(--ac);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-size:13px;z-index:950;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>観察マップ</h1>
    <div class="walk" id="walkLabel">ウォーク未選択</div>
    <button class="iconbtn" id="btnLocate" title="現在地へ" aria-label="現在地へ">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
    </button>
  </header>

  <main>
    <section class="view on" id="viewMap">
      <div id="map"></div>
      <div class="mode-tip" id="modeTip" hidden>地図をタップして位置を決める</div>
      <div class="start-hint" id="startHint" hidden>
        <span>ウォークを始めると記録ボタンが出ます</span>
        <button class="btn" id="btnGoWalks">始める</button>
      </div>
      <div class="fab-wrap" id="fabWrap">
        <button class="fab main" id="fabMain"><svg viewBox="0 0 24 24" id="fabIcon"></svg><span id="fabText">記録</span></button>
        <button class="fab memo" id="fabMemo"><svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="M13 7l4 4"/></svg>メモ</button>
      </div>
    </section>

    <section class="view" id="viewList">
      <div class="list">
        <h2 id="listTitle">タイムライン</h2>
        <div class="filters">
          <button class="chip on" data-f="all">すべて</button>
          <button class="chip" data-f="main" id="chipMain">記録</button>
          <button class="chip" data-f="memo">メモ</button>
          <button class="chip" data-f="star">★ 印象深い</button>
        </div>
        <div id="timeline"></div>
      </div>
    </section>

    <section class="view" id="viewWalks">
      <div class="walks">
        <h2>新しいウォーク</h2>
        <div class="modes" id="modes">
          <button class="mode on" data-m="sound">
            <span class="sw"><svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10H3z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg></span>
            <span class="n">サウンドマップ</span><span class="d">聞こえた音を地点ごとに。音源・強さ・擬音語</span>
          </button>
          <button class="mode" data-m="smell">
            <span class="sw"><svg viewBox="0 0 24 24"><path d="M6 20c0-3 2-4 2-7s-2-4-2-7"/><path d="M12 20c0-3 2-4 2-7s-2-4-2-7"/><path d="M18 20c0-3 2-4 2-7s-2-4-2-7"/></svg></span>
            <span class="n">香りのストーリー</span><span class="d">気づいた匂いをすべて。正体の推測・強さ・比喩</span>
          </button>
          <button class="mode" data-m="tool">
            <span class="sw"><svg viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0"/><path d="M5.5 12.5a10 10 0 0 1 13 0"/><path d="M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1"/></svg></span>
            <span class="n">ツールを使った歩行調査</span><span class="d">Wi-Fi名、測定値など、スマホが拾うものを地図に</span>
          </button>
        </div>
        <form class="newwalk" id="newWalkForm">
          <input id="newWalkName" placeholder="場所やタイトル（空欄でもOK）" autocomplete="off">
          <button class="btn" type="submit">開始</button>
        </form>
        <h2>これまでのウォーク</h2>
        <div id="walkList"></div>
        <div class="tools">
          <button class="btn ghost" id="btnExport">JSONを書き出す</button>
          <label class="btn ghost" style="text-align:center;cursor:pointer">JSONを読み込む<input type="file" id="fileImport" accept="application/json,.json" hidden></label>
          <button class="btn ghost" id="btnGeo">GeoJSONを書き出す</button>
          <button class="btn danger" id="btnClearWalk">このウォークを削除</button>
        </div>
        <div class="help">
          <b>使い方</b><br>
          種類を選んで開始 → 地図の大きいボタンで現在地に記録。「メモ」はなんでも書く用（ラベルだけ）。<br>
          GPSが取れないときは地図をタップして置く。<br>
          歩いている間はラベルと強さだけで十分。比喩や記憶は帰ってから一覧で追記。<br>
          ★を付けたものだけ地図に残すと、本でいう「最も印象深い音のサウンドマップ」になる。<br>
          記録はこの端末のブラウザに保存。JSONで書き出せば別端末やNotionへ。
        </div>
      </div>
    </section>
  </main>

  <nav>
    <button class="on" data-v="viewMap"><svg viewBox="0 0 24 24"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>地図</button>
    <button data-v="viewList"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>一覧</button>
    <button data-v="viewWalks"><svg viewBox="0 0 24 24"><path d="M13 4l2 3 3 1-1 4 2 5-3 1-2-4-3 2-1 5-3-1 1-6 3-3-1-4z"/><circle cx="14" cy="2.5" r="1.5"/></svg>ウォーク</button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="grip"></div>
  <div class="head">
    <span class="kind" id="shKind"></span>
    <span class="when mono" id="shWhen"></span>
    <span class="where mono" id="shWhere"></span>
  </div>
  <div class="field">
    <label for="fLabel" id="fLabelLabel"></label>
    <input id="fLabel" autocomplete="off" enterkeyhint="done">
  </div>
  <div class="field" id="fStrengthWrap">
    <label id="fStrengthLabel">強さ</label>
    <div class="seg" id="fStrength">
      <button type="button" data-s="1">1 かすか</button>
      <button type="button" data-s="2" class="on">2 ふつう</button>
      <button type="button" data-s="3">3 強い</button>
    </div>
  </div>
  <button type="button" class="more-toggle" id="moreToggle">もっと書く</button>
  <div id="more" hidden>
    <div class="field">
      <label for="fOno" id="fOnoLabel"></label>
      <input id="fOno" autocomplete="off">
    </div>
    <div class="field" id="fTagsWrap">
      <label>特徴</label>
      <div class="chips" id="fTags"></div>
    </div>
    <div class="field">
      <label for="fNote" id="fNoteLabel">メモ</label>
      <textarea id="fNote"></textarea>
    </div>
  </div>
  <div class="starrow" id="starRow">
    <button type="button" id="fStar">★</button><span>最も印象深い（マップに残す）</span>
  </div>
  <div class="actions">
    <button class="btn ghost" id="shDelete" hidden>削除</button>
    <button class="btn ghost" id="shCancel">閉じる</button>
    <button class="btn save" id="shSave">保存</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
const KEY = 'kansatsu-map-v2';
const MODES = {
  sound: { name:'サウンドマップ', short:'音', fab:'音を記録',
    icon:'<path d="M3 10v4h4l5 4V6L7 10H3z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/>',
    label:'なにの音（音源）', labelPh:'例：踏切、子どもの声、換気扇',
    strength:'音量', ono:'擬音語', onoPh:'例：カンカンカン、ゴォー',
    note:'メモ（強弱の変化、ほかの音との呼応）',
    tags:['連続','断続','遠い','近い','高い','低い','人の声','機械','自然','だんだん大きく','だんだん小さく','ほかの音と重なる'] },
  smell: { name:'香りのストーリー', short:'匂い', fab:'匂いを記録',
    icon:'<path d="M6 20c0-3 2-4 2-7s-2-4-2-7"/><path d="M12 20c0-3 2-4 2-7s-2-4-2-7"/><path d="M18 20c0-3 2-4 2-7s-2-4-2-7"/>',
    label:'なんの匂い（正体の推測）', labelPh:'例：焼き鳥の煙、金木犀、下水',
    strength:'強さ', ono:'ひとことで（形容詞・比喩）', onoPh:'例：雨上がりのアスファルト、祖母の家',
    note:'メモ（記憶、どこから来ているか）',
    tags:['甘い','焦げ','油','花','草木','土','排気','洗剤','食べ物','湿った','金属','記憶を呼ぶ'] },
  tool: { name:'ツールを使った歩行調査', short:'検出', fab:'検出を記録',
    icon:'<path d="M2 9a15 15 0 0 1 20 0"/><path d="M5.5 12.5a10 10 0 0 1 13 0"/><path d="M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1"/>',
    label:'検出したもの（Wi-Fi名、測定値など）', labelPh:'例：Buffalo-A-1234、aterm-…、0.08μSv/h',
    strength:'電波・信号の強さ', ono:'種類・数値', onoPh:'例：家庭用、店のフリーWi-Fi、5GHz',
    note:'メモ（どの建物か、名前の面白さ）',
    tags:['家庭','店舗','公共','フリーWi-Fi','キャリア','名前が変','パスワードなし','たくさん重なる','ここだけ'] },
};

// ---------- state ----------
let state = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.walks) return s; }catch(e){}
  return { walks: [], entries: [], currentWalk: null, lastCenter: null };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast('保存できませんでした（ブラウザの容量）'); } }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const curWalk = () => state.walks.find(w => w.id === state.currentWalk) || null;
const curMode = () => curWalk() ? curWalk().mode : null;
const walkEntries = () => state.entries.filter(e => e.walk === state.currentWalk).sort((a,b)=>a.t-b.t);
const $ = id => document.getElementById(id);

// ---------- map ----------
const map = L.map('map', { zoomControl:false }).setView(state.lastCenter || [35.735, 139.65], state.lastCenter ? 16 : 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap' }).addTo(map);
const layer = L.layerGroup().addTo(map);
let meMarker = null, myPos = null, watching = false;
map.on('moveend', () => { const c = map.getCenter(); state.lastCenter = [c.lat, c.lng]; save(); });

function startWatch(){
  if(!navigator.geolocation){ toast('この端末では位置情報が使えません'); return; }
  if(watching) return;
  watching = true;
  navigator.geolocation.watchPosition(p => {
    myPos = [p.coords.latitude, p.coords.longitude];
    if(!meMarker){
      meMarker = L.marker(myPos, { icon: L.divIcon({className:'', html:'<div class="me"></div>', iconSize:[14,14], iconAnchor:[7,7]}), interactive:false }).addTo(map);
      map.setView(myPos, 17);
    } else meMarker.setLatLng(myPos);
  }, err => {
    watching = false;
    toast(err.code === 1 ? '位置情報が許可されていません。地図タップで置けます' : '現在地を取得できません');
  }, { enableHighAccuracy:true, maximumAge:5000, timeout:15000 });
}
$('btnLocate').onclick = () => { if(myPos) map.setView(myPos, Math.max(map.getZoom(),17)); else startWatch(); };

function pinIcon(e){
  const cls = ['pin', e.kind, 's'+(e.strength||2), e.star ? 'star' : '', (filter==='star' && !e.star) ? 'dim' : ''].join(' ');
  const memo = e.kind === 'memo';
  return L.divIcon({ className:'', html:`<div class="${cls}"><i></i></div>`, iconSize: memo?[18,18]:[26,26], iconAnchor: memo?[9,9]:[6,26], popupAnchor: memo?[0,-10]:[7,-24] });
}
function renderPins(){
  layer.clearLayers();
  walkEntries().forEach(e => {
    const m = L.marker([e.lat, e.lng], { icon: pinIcon(e) }).addTo(layer);
    const head = e.kind === 'memo' ? 'メモ' : `${MODES[e.kind].short} · 強さ${e.strength}`;
    m.bindPopup(`<div class="t mono">${fmtTime(e.t)} · ${head}${e.star?' ★':''}</div><b>${esc(e.label||'（無題）')}</b>${e.ono?`<span class="ono">${esc(e.ono)}</span><br>`:''}${e.note?esc(e.note):''}<br><a href="#" data-edit="${e.id}">編集</a>`);
  });
}
map.on('popupopen', ev => {
  const a = ev.popup.getElement().querySelector('[data-edit]');
  if(a) a.onclick = x => { x.preventDefault(); map.closePopup(); openSheet(state.entries.find(e=>e.id===a.dataset.edit)); };
});

let placing = null;
map.on('click', ev => {
  if(!placing) return;
  const kind = placing; placing = null; $('modeTip').hidden = true;
  newEntry(kind, ev.latlng.lat, ev.latlng.lng);
});

// ---------- entries ----------
function newEntry(kind, lat, lng){
  openSheet({ id: uid(), walk: state.currentWalk, kind, lat, lng, t: Date.now(), label:'', strength:2, ono:'', tags:[], note:'', star:false }, true);
}
function record(kind){
  if(!curWalk()){ showView('viewWalks'); return; }
  if(myPos){ newEntry(kind, myPos[0], myPos[1]); return; }
  if(!watching) startWatch();
  placing = kind; $('modeTip').hidden = false;
  toast('GPS待ち。すぐ置きたいときは地図をタップ');
  const started = Date.now();
  const iv = setInterval(() => {
    if(placing !== kind){ clearInterval(iv); return; }
    if(myPos){ clearInterval(iv); placing = null; $('modeTip').hidden = true; newEntry(kind, myPos[0], myPos[1]); }
    else if(Date.now() - started > 8000) clearInterval(iv);
  }, 300);
}
$('fabMain').onclick = () => record(curMode());
$('fabMemo').onclick = () => record('memo');
$('btnGoWalks').onclick = () => showView('viewWalks');

// ---------- sheet ----------
const sheet = $('sheet'), scrim = $('scrim');
let editing = null, isNew = false;
function openSheet(e, fresh=false){
  editing = JSON.parse(JSON.stringify(e)); isNew = fresh;
  const memo = e.kind === 'memo', M = memo ? null : MODES[e.kind];
  sheet.className = 'sheet ' + e.kind;
  $('shKind').textContent = memo ? 'メモ' : M.short;
  $('shWhen').textContent = fmtTime(e.t);
  $('shWhere').textContent = e.lat.toFixed(5) + ', ' + e.lng.toFixed(5);
  $('fLabelLabel').textContent = memo ? 'メモ' : M.label;
  $('fLabel').placeholder = memo ? '見たこと、気づいたこと、なんでも' : M.labelPh;
  $('fLabel').value = e.label;
  $('fStrengthWrap').hidden = memo;
  $('moreToggle').hidden = memo;
  $('starRow').hidden = memo;
  $('more').hidden = !(!memo && !fresh && (e.ono || e.note || (e.tags||[]).length));
  $('moreToggle').textContent = $('more').hidden ? 'もっと書く' : '閉じる';
  if(!memo){
    $('fStrengthLabel').textContent = M.strength;
    $('fOnoLabel').textContent = M.ono; $('fOno').placeholder = M.onoPh; $('fOno').value = e.ono || '';
    $('fNoteLabel').textContent = M.note; $('fNote').value = e.note || '';
    [...$('fStrength').children].forEach(b => b.classList.toggle('on', +b.dataset.s === (e.strength||2)));
    $('fStar').classList.toggle('on', !!e.star);
    const tags = $('fTags'); tags.innerHTML = '';
    M.tags.forEach(t => { const b = document.createElement('button'); b.type='button'; b.textContent = t; b.classList.toggle('on', (e.tags||[]).includes(t)); b.onclick = () => b.classList.toggle('on'); tags.appendChild(b); });
  }
  $('shDelete').hidden = fresh;
  sheet.hidden = false; scrim.hidden = false;
  requestAnimationFrame(() => { sheet.classList.add('show'); scrim.classList.add('show'); });
  setTimeout(() => $('fLabel').focus(), 250);
}
function closeSheet(){
  sheet.classList.remove('show'); scrim.classList.remove('show');
  setTimeout(() => { sheet.hidden = true; scrim.hidden = true; }, 220);
  editing = null;
}
$('moreToggle').onclick = () => { $('more').hidden = !$('more').hidden; $('moreToggle').textContent = $('more').hidden ? 'もっと書く' : '閉じる'; };
$('fStrength').onclick = ev => { const b = ev.target.closest('button'); if(!b) return; [...$('fStrength').children].forEach(x=>x.classList.toggle('on', x===b)); };
$('fStar').onclick = () => $('fStar').classList.toggle('on');
$('shCancel').onclick = closeSheet;
scrim.onclick = closeSheet;
$('fLabel').addEventListener('keydown', ev => { if(ev.key === 'Enter'){ ev.preventDefault(); $('shSave').click(); } });
$('shSave').onclick = () => {
  if(!editing) return;
  editing.label = $('fLabel').value.trim();
  if(editing.kind !== 'memo'){
    editing.ono = $('fOno').value.trim();
    editing.note = $('fNote').value.trim();
    editing.strength = +$('fStrength').querySelector('.on').dataset.s;
    editing.star = $('fStar').classList.contains('on');
    editing.tags = [...$('fTags').querySelectorAll('.on')].map(b => b.textContent);
  }
  const i = state.entries.findIndex(x => x.id === editing.id);
  if(i >= 0) state.entries[i] = editing; else state.entries.push(editing);
  save(); renderAll(); closeSheet(); toast(isNew ? '記録した' : '更新した');
};
$('shDelete').onclick = () => {
  if(!editing) return;
  state.entries = state.entries.filter(x => x.id !== editing.id);
  save(); renderAll(); closeSheet(); toast('削除した');
};

// ---------- list ----------
let filter = 'all';
document.querySelector('.filters').onclick = ev => {
  const b = ev.target.closest('.chip'); if(!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('.filters .chip').forEach(c => c.classList.toggle('on', c === b));
  renderAll();
};
function renderList(){
  const box = $('timeline'), M = curMode() ? MODES[curMode()] : null;
  $('listTitle').textContent = M ? `${M.name} · タイムライン` : 'タイムライン';
  $('chipMain').textContent = M ? M.short : '記録';
  let es = walkEntries();
  if(filter === 'main') es = es.filter(e => e.kind !== 'memo');
  if(filter === 'memo') es = es.filter(e => e.kind === 'memo');
  if(filter === 'star') es = es.filter(e => e.star);
  if(!es.length){ box.innerHTML = `<div class="empty">${curWalk() ? 'まだ記録がない。地図の大きいボタンから。' : 'ウォークを開始すると、ここにタイムラインが並ぶ'}</div>`; return; }
  let html = '<div class="timeline">', lastDay = '';
  es.forEach(e => {
    const d = new Date(e.t).toLocaleDateString('ja-JP', {month:'numeric', day:'numeric', weekday:'short'});
    if(d !== lastDay){ html += `<div class="daysep mono">${d}</div>`; lastDay = d; }
    const memo = e.kind === 'memo';
    html += `<div class="row ${e.kind}">
      <span class="time mono">${fmtTime(e.t)}</span><span class="dot"></span>
      <div class="label">${memo?'<span class="k">メモ</span>':''}${esc(e.label||'（無題）')}</div>
      ${memo?'':`<button class="star ${e.star?'on':''}" data-star="${e.id}" aria-label="印象深い">★</button>`}
      ${memo?'':`<div class="meta">${e.ono?`<span class="ono">${esc(e.ono)}</span> · `:''}<span class="strength">${MODES[e.kind].strength} <b>${'●'.repeat(e.strength)}${'○'.repeat(3-e.strength)}</b></span>${(e.tags||[]).length?` · ${e.tags.map(esc).join('・')}`:''}${e.note?`<br>${esc(e.note)}`:''}</div>`}
      <button class="edit" data-edit="${e.id}">${memo?'編集':'編集・追記'}</button>
    </div>`;
  });
  box.innerHTML = html + '</div>';
}
$('timeline').onclick = ev => {
  const s = ev.target.closest('[data-star]'); if(s){ const e = state.entries.find(x=>x.id===s.dataset.star); e.star = !e.star; save(); renderAll(); return; }
  const ed = ev.target.closest('[data-edit]'); if(ed){ openSheet(state.entries.find(x=>x.id===ed.dataset.edit)); }
};

// ---------- walks ----------
let pickedMode = 'sound';
$('modes').onclick = ev => {
  const b = ev.target.closest('.mode'); if(!b) return;
  pickedMode = b.dataset.m;
  document.querySelectorAll('.mode').forEach(m => m.classList.toggle('on', m === b));
};
function defaultWalkName(mode){ const d = new Date(); return `${d.getMonth()+1}/${d.getDate()} ${MODES[mode].name}`; }
$('newWalkForm').onsubmit = ev => {
  ev.preventDefault();
  const name = $('newWalkName').value.trim() || defaultWalkName(pickedMode);
  const w = { id: uid(), name, mode: pickedMode, started: Date.now() };
  state.walks.unshift(w); state.currentWalk = w.id; $('newWalkName').value = '';
  save(); renderAll(); showView('viewMap'); startWatch(); toast(`「${name}」を開始`);
};
function renderWalks(){
  const box = $('walkList');
  if(!state.walks.length){ box.innerHTML = '<div class="empty">まだウォークがない</div>'; }
  else box.innerHTML = state.walks.map(w => {
    const n = state.entries.filter(e => e.walk === w.id), st = n.filter(e=>e.star).length;
    const cur = w.id === state.currentWalk;
    return `<div class="walkcard ${cur?'current':''}">
      <span class="bar ${w.mode}"></span>
      <div class="name">${esc(w.name)}</div>
      <div class="sub mono">${MODES[w.mode].name} · ${new Date(w.started).toLocaleDateString('ja-JP')} · ${n.length}件${st?` · ★${st}`:''}</div>
      <button class="go ${cur?'now':''}" data-walk="${w.id}">${cur?'記録中':'開く'}</button>
    </div>`;
  }).join('');
  const w = curWalk();
  document.body.dataset.mode = w ? w.mode : '';
  $('walkLabel').innerHTML = w ? `<span class="k">${MODES[w.mode].short}</span><b>${esc(w.name)}</b>` : 'ウォーク未選択';
  $('startHint').hidden = !!w;
  $('fabWrap').hidden = !w;
  if(w){ $('fabIcon').innerHTML = MODES[w.mode].icon; $('fabText').textContent = MODES[w.mode].fab; }
}
$('walkList').onclick = ev => {
  const b = ev.target.closest('[data-walk]'); if(!b) return;
  state.currentWalk = b.dataset.walk; save(); renderAll();
  const es = walkEntries(); if(es.length) map.fitBounds(es.map(e=>[e.lat,e.lng]), {padding:[40,40], maxZoom:17});
  showView('viewMap');
};
$('btnClearWalk').onclick = () => {
  const w = curWalk(); if(!w){ toast('ウォークが選ばれていない'); return; }
  const b = $('btnClearWalk');
  if(b.dataset.arm !== w.id){ b.dataset.arm = w.id; b.textContent = 'もう一度押すと削除'; setTimeout(()=>{ b.dataset.arm=''; b.textContent='このウォークを削除'; }, 3000); return; }
  state.entries = state.entries.filter(e => e.walk !== w.id);
  state.walks = state.walks.filter(x => x.id !== w.id);
  state.currentWalk = state.walks[0]?.id || null;
  b.dataset.arm=''; b.textContent='このウォークを削除';
  save(); renderAll(); toast('削除した');
};

// ---------- export / import ----------
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
$('btnExport').onclick = () => download(`kansatsu-map-${today()}.json`, JSON.stringify(state, null, 2), 'application/json');
$('btnGeo').onclick = () => {
  const w = curWalk(); if(!w){ toast('ウォークが選ばれていない'); return; }
  const fc = { type:'FeatureCollection', name:w.name, mode:w.mode, features: walkEntries().map(e => ({
    type:'Feature', geometry:{ type:'Point', coordinates:[e.lng, e.lat] },
    properties:{ time:new Date(e.t).toISOString(), kind:e.kind, label:e.label, strength:e.strength, detail:e.ono, tags:e.tags, note:e.note, star:e.star }
  }))};
  download(`${w.name.replace(/[\/\\:]/g,'-')}.geojson`, JSON.stringify(fc, null, 2), 'application/geo+json');
};
$('fileImport').onchange = ev => {
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const s = JSON.parse(r.result);
      if(!s.walks || !s.entries) throw 0;
      const ids = new Set(state.entries.map(e=>e.id)); const wids = new Set(state.walks.map(w=>w.id));
      s.walks.forEach(w => { if(!wids.has(w.id)) state.walks.push({mode:'sound', ...w}); });
      s.entries.forEach(e => { if(!ids.has(e.id)) state.entries.push(e); });
      state.walks.sort((a,b)=>b.started-a.started);
      save(); renderAll(); toast('読み込んだ');
    }catch(e){ toast('このファイルは読めない'); }
    ev.target.value = '';
  };
  r.readAsText(f);
};

// ---------- views ----------
function showView(id){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === id));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === id));
  if(id === 'viewMap') setTimeout(()=>map.invalidateSize(), 50);
}
document.querySelector('nav').onclick = ev => { const b = ev.target.closest('button'); if(b) showView(b.dataset.v); };

// ---------- utils ----------
function fmtTime(t){ const d = new Date(t); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function today(){ const d = new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let toastTimer; function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2200); }
function renderAll(){ renderPins(); renderList(); renderWalks(); }

renderAll();
if(!curWalk()) showView('viewWalks');
else { const es = walkEntries(); if(es.length) map.fitBounds(es.map(e=>[e.lat,e.lng]), {padding:[40,40], maxZoom:17}); }
if(location.protocol === 'https:' || location.hostname === 'localhost') startWatch();
})();
</script>
</body>
</html>
